<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAP BOSS — до листинга</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="score"><span id="scoreVal">0</span> COIN</div>
  <div class="timer-wrap">
    <div class="timer-label">До листинга</div>
    <div class="timer" id="timerVal">--:--:--</div>
  </div>
</div>

<div class="stage">
  <div class="character">
    <img id="legs" src="legs.png" alt="ноги" class="part part-legs">
    <img id="body" src="body.png" alt="тело" class="part part-body">
    <img id="armLeft" src="arm-left.png" alt="левая рука" class="part part-arm-left">
    <img id="armRight" src="arm-right.png" alt="правая рука" class="part part-arm-right">
    <img id="head" src="head.png" alt="голова" class="part part-head">
  </div>
</div>

<div class="bottom-panel">
  <div class="stats-row">
    <div class="pill" id="comboPill">Комбо: 0</div>
    <div class="pill" id="perTapPill">За тап: +1</div>
  </div>
  <div class="footer-note">Тапай по любой части</div>
</div>

<script src="script.js"></script>
</body>
</html>
