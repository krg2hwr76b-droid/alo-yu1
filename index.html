<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAP BOSS — до листинга</title>
<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключаем внешние стили -->
<link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>

<div class="bg-grid"></div>
<div class="sun"></div>

<div class="topbar">
  <div class="score">💰 <span id="scoreVal">0</span> COIN</div>
  <div class="timer-wrap">
    <div class="timer-label">До листинга</div>
    <div class="timer" id="timerVal">--:--:--</div>
  </div>
</div>

<div class="stage">
  <div class="character">
    <div class="glow-ring"></div>
    <div class="arm arm-left" id="armLeft"></div>
    <div class="arm arm-right" id="armRight"></div>
    <div class="torso"></div>
    <div class="tie"></div>
    <div class="head">
      <div class="hair"></div>
      <div class="face-line"></div>
    </div>
    <div class="legs-wrap" id="legs">
      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>
    </div>
    <div class="hint">Мультитач активен: жми в несколько мест сразу!</div>
  </div>
</div>

<div class="bottom-panel">
  <div class="big-tap" id="bigTap">ТАПНИ ПО БОССУ +1</div>
  <div class="stats-row">
    <div class="pill" id="comboPill">Комбо: 0</div>
    <div class="pill" id="perTapPill">За тап: +1</div>
  </div>
  <div class="footer-note">Модульная архитектура для легких обновлений.</div>
</div>

<!-- Подключаем файл логики (версию можно менять при обновлениях, например ?v=1.1) -->
<script src="game.js?v=1.0"></script>

</body>
</html>
