<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAP BOSS — до листинга</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="sun"></div>

<div class="topbar">
  <div class="score">💰 <span id="scoreVal">0</span> COIN</div>
  <div class="timer-wrap">
    <div class="timer-label">До листинга</div>
    <div class="timer" id="timerVal">--:--:--</div>
  </div>
</div>

<div class="stage">
  <div class="character-container">
    <img id="characterImg" src="IMG_7416.png" alt="boss" class="char-img">
    
    <!-- Интерактивные зоны на теле персонажа -->
    <div class="body-part head" data-part="head" title="Голова - Пианино"></div>
    <div class="body-part left-arm" data-part="left-arm" title="Левая рука - Гитара"></div>
    <div class="body-part right-arm" data-part="right-arm" title="Правая рука - Флейта"></div>
    <div class="body-part left-leg" data-part="left-leg" title="Левая нога - Басс"></div>
    <div class="body-part right-leg" data-part="right-leg" title="Правая нога - Барабаны"></div>
    
    <div class="hint">нажимай на части тела! 🎵</div>
  </div>
</div>

<div class="bottom-panel">
  <div class="stats-row">
    <div class="pill" id="comboPill">Комбо: 0</div>
    <div class="pill" id="perTapPill">За тап: +1</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
