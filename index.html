<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAP BOSS — до листинга</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="score"><span id="scoreVal">0</span> COIN</div>
  <div class="timer-wrap">
    <div class="timer-label">До листинга</div>
    <div class="timer" id="timerVal">--:--:--</div>
  </div>
</div>

<div class="stage">
  <div class="character">
    <div id="head" class="part part-head">
      <img src="head.png" alt="голова">
    </div>
    <div id="body" class="part part-body">
      <img src="body.png" alt="тело">
    </div>
    <div id="armLeft" class="part part-arm-left">
      <img src="arm-left.png" alt="левая рука">
    </div>
    <div id="armRight" class="part part-arm-right">
      <img src="arm-right.png" alt="правая рука">
    </div>
    <div id="legs" class="part part-legs">
      <img src="legs.png" alt="ноги">
    </div>
  </div>
</div>

<div class="bottom-panel">
  <div class="stats-row">
    <div class="pill" id="comboPill">Комбо: 0</div>
    <div class="pill" id="perTapPill">За тап: +1</div>
  </div>
  <div class="footer-note">Тапай по любой части</div>
</div>

<script src="script.js"></script>
</body>
</html>
