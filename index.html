<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAP BOSS — до листинга</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grid"></div>
<div class="sun"></div>

<div class="topbar">
  <div class="score"><span id="scoreVal">0</span> COIN</div>
  <div class="timer-wrap">
    <div class="timer-label">До листинга</div>
    <div class="timer" id="timerVal">--:--:--</div>
  </div>
</div>

<div class="stage">
  <div class="character">
    <div class="piece body-piece" id="body" aria-label="Корпус"></div>
    <div class="piece leg-left" id="legLeft" aria-label="Левая нога"></div>
    <div class="piece leg-right" id="legRight" aria-label="Правая нога"></div>
    <div class="piece arm-left" id="armLeft" aria-label="Левая рука"></div>
    <div class="piece arm-right" id="armRight" aria-label="Правая рука"></div>
    <div class="piece head-piece" id="head" aria-label="Голова"></div>
    <div class="balance"></div>
    <div class="hint">нажми на часть тела</div>
  </div>
</div>

<div class="bottom-panel">
  <div class="big-tap" id="bigTap">ТАПНИ ПО БОССУ</div>
  <div class="stats-row">
    <div class="pill" id="comboPill">Комбо: 0</div>
    <div class="pill" id="perTapPill">За тап: +1</div>
    <div class="pill" id="balancePill">Баланс</div>
  </div>
  <div class="footer-note">Каждая часть играет свой инструмент</div>
</div>

<script src="script.js"></script>
</body>
</html>
